AWSTemplateFormatVersion: '2010-09-09'
Description: Atlas Premier Properties - Windows Server and IIS behind CloudFront (HTTPS)

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  WindowsAmiId:
    Type: AWS::EC2::Image::Id
    Description: Pinned at first deploy so later stack updates never replace the server, whose disk holds the database.
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: ID of the com.amazonaws.global.cloudfront.origin-facing managed prefix list in this region.

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: artifact-bucket-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/ssm-logs/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetEncryptionConfiguration
                Resource: !GetAtt ArtifactBucket.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from CloudFront only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WindowsAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt WebSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-web

  WebServerIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServer

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref AWS::StackName
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: web-server
            # CloudFront origins must be DNS names; this is the Elastic IP's public DNS name, which survives stop/start.
            DomainName: !Sub
              - ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com
              - Dashed: !Join ['-', !Split ['.', !Ref WebServerIp]]
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: web-server
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  InstanceId:
    Value: !Ref WebServer
  OriginPublicIp:
    Value: !Ref WebServerIp
